services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2.4.0
    hostname: opensearch
    container_name: opensearch
    environment:
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: on-failure
    depends_on:
      - mongodb

  graylog:
    image: graylog/graylog:5.1.5
    hostname: graylog
    container_name: graylog
    depends_on:
      - mongodb
      - opensearch
    environment:
      GRAYLOG_PASSWORD_SECRET: f62c92ac283e4f1f969ad5e71d4c7b2e11e9bdbf5e193ae7bb4e9b4e1e956e437c98a43cd624c5ea8a2c97b9463f96e8
      GRAYLOG_ROOT_PASSWORD_SHA2: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9000/
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
    ports:
      - "9000:9000"
      - "12201:12201/udp"
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/api/system/lbstatus || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    depends_on:
      - zookeeper

  kafka2:
  image: confluentinc/cp-kafka:7.5.0
  container_name: kafka2
  ports:
    - "9093:9093"
  environment:
    KAFKA_BROKER_ID: 2
    KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
    KAFKA_NUM_PARTITIONS: 5
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  depends_on:
    - zookeeper

  kafka3:
  image: confluentinc/cp-kafka:7.5.0
  container_name: kafka3
  ports:
    - "9094:9094"
  environment:
    KAFKA_BROKER_ID: 3
    KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
    KAFKA_NUM_PARTITIONS: 5
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  depends_on:
    - zookeeper

  pmp-gateway:
    image: pmp-gateway:latest
    hostname: pmp-gateway
    container_name: pmp-gateway
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      APPLICATION_NAME: pmp-gateway
      LOGIN_SERVICE_URI: http://pmp-login:8081
      PESSOA_SERVICE_URI: http://pmp:8082
      JWT_SECRET_KEY: e2998d41e327e8af4a5c2dfd0d961f2a8a21bec5c67d1f4cf8afee5e37707f60
    depends_on:
      - pmp-login
      - pmp

  pmp-login:
    image: pmp-login:latest
    hostname: pmp-login
    container_name: pmp-login
    expose:
      - "8081"
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093,kafka3:9094
      KAFKA_REPLICAS: 3
      KAFKA_PARTITIONS: 5
      SERVER_PORT: 8081
      APPLICATION_NAME: pmp-login
      LOCALE_RESOLVER: fixed
      LOCALE: pt_BR
      MONGODB_URI: mongodb://mongodb:27017/pmp
      JWT_SECRET_KEY: e2998d41e327e8af4a5c2dfd0d961f2a8a21bec5c67d1f4cf8afee5e37707f60
    depends_on:
      - mongodb

  pmp:
    image: pmp:latest
    hostname: pmp
    container_name: pmp
    expose:
      - "8082"
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      APPLICATION_NAME: pmp
      LOCALE_RESOLVER: fixed
      LOCALE: pt_BR
      MONGODB_URI: mongodb://mongodb:27017/pmp
      GRAYLOG_HOST: graylog
    depends_on:
      - mongodb

  pmp-lambda:
    image: pmp-lambda:latest
    hostname: pmp-lambda
    container_name: pmp-lambda
    ports:
      - "8083:8083"
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093,kafka3:9094
      KAFKA_REPLICAS: 3
      KAFKA_PARTITIONS: 5
      KAFKA_TOPIC: forget
      KAFKA_CONSUMER_GROUP_ID: pmp-lambda
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  pmp-consumer1:
    image: pmp-consumer:latest
    hostname: pmp-consumer1
    container_name: pmp-consumer1
    ports:
      - "8084:8084"
    restart: unless-stopped
    environment:
      APPLICATION_NAME: pmp-consumer1
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093,kafka3:9094
      KAFKA_REPLICAS: 3
      KAFKA_PARTITIONS: 5
      KAFKA_TOPIC: forget
      KAFKA_CONSUMER_GROUP_ID: pmp-consumer1
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  pmp-consumer2:
    image: pmp-consumer:latest
    hostname: pmp-consumer2
    container_name: pmp-consumer2
    ports:
      - "8085:8085"
    restart: unless-stopped
    environment:
      APPLICATION_NAME: pmp-consumer2
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093,kafka3:9094
      KAFKA_REPLICAS: 3
      KAFKA_PARTITIONS: 5
      KAFKA_TOPIC: forget
      KAFKA_CONSUMER_GROUP_ID: pmp-consumer2
    depends_on:
      - kafka1
      - kafka2
      - kafka3

volumes:
  mongo-data: {}