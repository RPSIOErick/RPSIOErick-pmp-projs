name: pmp

on:
  push:
    branches:
      - pmp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Build Maven
        run: mvn clean install -DskipTests

      - name: DockerHub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.ERICK_USER }}
          password: ${{ secrets.ERICK_PASS }}

      - name: Build and Push Image
        run: |
          docker build -t erickbastos/pmp:${{ github.sha }} .
          docker push erickbastos/pmp:${{ github.sha }}